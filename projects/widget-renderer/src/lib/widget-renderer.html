<section
  class="widget-shell"
  [style.width.px]="widgetWidth()"
  [style.height.px]="245"
  [style.background-color]="widget().background.color || 'transparent'"
  [style.background-image]="backgroundImage()"
  [style.background-size]="widget().background.size"
  [style.background-position]="widget().background.anchor"
  [style.background-repeat]="widget().background.repeat ? 'repeat' : 'no-repeat'"
>
  <div
    class="widget-overlay"
    [style.background-color]="widget().background.overlayColor || 'transparent'"
  ></div>
  <div class="widget-toolbar" aria-label="Widget actions">
    @if (widget().refresh.enabled) {
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="widget().refresh.label"
        [title]="widget().refresh.label"
        (click)="refreshRequested.emit()"
      >
        ↻
      </button>
    }
    @if (hasSensitiveElements()) {
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="sensitiveVisible() ? 'Hide sensitive data' : 'Show sensitive data'"
        [title]="sensitiveVisible() ? 'Hide sensitive data' : 'Show sensitive data'"
        (click)="toggleSensitive()"
      >
        @if (sensitiveVisible()) {
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path
              d="m3 3 18 18M10.6 5.3A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 3.4-.6"
            />
          </svg>
        }
      </button>
    }
  </div>
  <div
    class="widget-grid"
    [style.grid-template-rows]="gridRows()"
    [style.grid-template-columns]="gridColumns()"
  >
    @for (element of widget().elements; track element.id) {
      <div
        class="widget-element"
        [attr.data-widget-element-id]="element.id"
        [class.is-sensitive]="element.sensitive && !sensitiveVisible()"
        [style]="elementStyle(element)"
      >
        <div
          class="element-content"
          [class.is-sensitive]="element.sensitive && !sensitiveVisible()"
          [style.justify-content]="horizontalAnchor(element.anchor)"
          [style.align-items]="verticalAnchor(element.anchor)"
        >
          @if (isText(element)) {
            <span
              class="text-element"
              [style.color]="element.style.color"
              [style.font-size.px]="element.style.fontSize"
              [style.font-weight]="element.style.fontWeight"
              [style.font-style]="element.style.italic ? 'italic' : 'normal'"
              [style.text-decoration]="
                element.style.underline && element.style.strikethrough
                  ? 'underline line-through'
                  : element.style.underline
                    ? 'underline'
                    : element.style.strikethrough
                      ? 'line-through'
                      : 'none'
              "
              [style.text-align]="element.style.align"
              [style.white-space]="element.style.wrap ? 'normal' : 'nowrap'"
              >{{ element.text }}</span
            >
          } @else if (isImage(element)) {
            <img
              [src]="element.source"
              [alt]="element.alt"
              [style.object-fit]="element.fit"
              [style.object-position]="element.anchor"
              [style.border-radius.px]="element.radius"
            />
            <span
              class="image-overlay"
              [style.background-color]="element.overlayColor || 'transparent'"
            ></span>
          } @else if (isButton(element)) {
            <button
              type="button"
              class="action-button"
              [class.solid]="element.style === 'solid'"
              [class.outline]="element.style === 'outline'"
              (click)="actionRequested.emit({ element, event: $event })"
            >
              {{ element.label }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</section>

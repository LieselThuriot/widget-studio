@if (isProgress(element())) {
  <widget-progress-element
    [element]="progress(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
} @else if (isSeries(element())) {
  <widget-series-chart
    [element]="series(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
} @else if (isPart(element())) {
  <widget-part-chart
    [element]="part(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
} @else {
  <widget-gauge-chart
    [element]="gauge(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
}

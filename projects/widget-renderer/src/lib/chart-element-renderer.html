@if (isProgress(element())) {
  <widget-progress-element
    [element]="progress(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
} @else {
  <widget-echarts-element
    [element]="chart(element())"
    [sensitiveHidden]="sensitiveHidden()"
    [locale]="locale()"
  />
}

<header class="landscape-toolbar">
  @if (editing()) {
    <div class="landscape-toolbar-heading">
      <span class="landscape-kicker">{{ locale().landscape }}</span>
      @if (!columnsLocked()) {
        <div class="landscape-column-control">
          <label class="landscape-columns-field">
            <span>{{ locale().columns }}</span>
            <input
              type="number"
              [min]="minimumColumns()"
              [value]="columns()"
              [attr.aria-label]="locale().aria.columns"
              (input)="columnsChanged.emit($event)"
            />
          </label>
          @if (!responsiveControlled()) {
            <label class="landscape-responsive-control">
              <input
                type="checkbox"
                class="landscape-responsive-toggle"
                [checked]="responsive()"
                [attr.aria-label]="locale().aria.responsive"
                (change)="responsiveChanged.emit($event)"
              />
              <span class="landscape-responsive-slider" aria-hidden="true"></span>
              <span class="landscape-responsive-label">{{ locale().responsive }}</span>
            </label>
          }
        </div>
      } @else {
        <strong>{{ locale().columnCount(columns()) }}</strong>
      }
    </div>
  }
  @if (hasPalette()) {
    @if (!editing()) {
      <div class="landscape-toolbar-actions">
        <button
          type="button"
          class="landscape-icon-button"
          [attr.aria-label]="locale().aria.edit"
          [title]="locale().aria.edit"
          (click)="editRequested.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="m15.5 5.5 3 3M4 20l3.5-.75L19.75 7a2.12 2.12 0 0 0-3-3L4.75 16.25 4 20Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.7"
            />
          </svg>
        </button>
      </div>
    } @else {
      <div class="landscape-toolbar-actions">
        <button type="button" class="landscape-button" (click)="editCancelled.emit()">
          {{ locale().cancel }}
        </button>
        <button
          type="button"
          class="landscape-button landscape-button--primary"
          (click)="confirm.emit()"
        >
          {{ locale().confirm }}
        </button>
      </div>
    }
  }
</header>

<section
  class="landscape-shell"
  [class.is-editing]="isEditing()"
  [class.is-dark]="darkMode()"
  [class.is-responsive]="responsive()"
  [class.palette-on-left]="paletteSide() === 'left'"
  [class.is-dragging]="dragId() !== null || dragPaletteItem() !== null"
>
  <widget-landscape-toolbar
    [editing]="isEditing()"
    [hasPalette]="paletteItems().length > 0"
    [columnsLocked]="columnsLocked()"
    [responsiveControlled]="responsive() !== undefined"
    [columns]="activeState().columns"
    [minimumColumns]="minimumColumns()"
    [responsive]="activeState().responsive"
    [locale]="resolvedLocale()"
    (editRequested)="enterEdit()"
    (editCancelled)="cancelEdit()"
    (confirm)="confirmEdit()"
    (columnsChanged)="updateColumns($event)"
    (responsiveChanged)="updateResponsive($event)"
  />
  <div class="landscape-body">
    <div
      #landscapeGrid
      class="landscape-grid"
      [style.--landscape-columns]="renderedState().columns"
      [class.is-dragging]="dragId() !== null || dragPaletteItem() !== null"
      (dragover)="dragOverWidget($event)"
      (dragleave)="dragLeaveWidget($event)"
      (drop)="dropWidget($event)"
    >
      @if (isEditing()) {
        <div
          class="landscape-column-boundary"
          [style.left.px]="columnBoundaryOffset()"
          aria-hidden="true"
        ></div>
      }
      @for (item of renderedState().widgets; track item.id; let index = $index) {
        <widget-landscape-item
          [item]="item"
          [editing]="isEditing()"
          [selected]="item.id === selectedId()"
          [dragSource]="item.id === dragId()"
          [alternate]="index % 2 === 0"
          [darkMode]="darkMode()"
          [locale]="resolvedLocale()"
          (dragStarted)="startDrag($event.event, $event.id)"
          (dragEnded)="endDrag()"
          (widgetSelected)="selectWidget($event)"
          (deleted)="deleteWidget($event)"
          (moved)="moveFromKeyboard($event)"
          (refreshRequested)="refresh($event)"
          (actionRequested)="action($event.id, $event)"
        />
      }
      @if (dragTarget(); as target) {
        <div
          class="landscape-drop-placeholder"
          [class.is-invalid]="!canFitDraggedWidget()"
          [style.grid-area]="
            target.row +
            1 +
            ' / ' +
            (target.column + 1) +
            ' / ' +
            (target.row + footprintFor(draggedWidgetForTemplate()!).rowSpan + 1) +
            ' / ' +
            (target.column + footprintFor(draggedWidgetForTemplate()!).columnSpan + 1)
          "
          aria-hidden="true"
        ></div>
      }
      @if (!renderedState().widgets.length) {
        <p class="landscape-empty">
          {{ isEditing() ? resolvedLocale().emptyEditMode : resolvedLocale().emptyLandscape }}
        </p>
      }
    </div>
    @if (isEditing()) {
      <widget-landscape-palette
        #landscapePalette
        [items]="paletteItems()"
        [invalidIds]="invalidPaletteIds()"
        [hasWidgets]="activeState().widgets.length > 0"
        [locale]="resolvedLocale()"
        (added)="addFromPalette($event)"
        (cleared)="clearWidgets()"
        (dragStarted)="startPaletteDrag($event.event, $event.item)"
        (dragEnded)="endDrag()"
      />
    }
  </div>
</section>

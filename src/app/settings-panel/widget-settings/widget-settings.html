<div class="widget-settings">
  <div class="selected-chip">
    <span class="chip-icon">W</span><span>Widget</span
    ><span class="chip-id">{{ width() }} × {{ height() }}</span>
  </div>
  <app-widget-grid-settings
    [widget]="widget()"
    (widgetChanged)="widgetChanged.emit($event)"
    (trackChanged)="trackChanged.emit($event)"
    (trackAdded)="trackAdded.emit($event)"
    (trackRemoved)="trackRemoved.emit($event)"
  />
  <app-widget-background-settings [widget]="widget()" (changed)="widgetChanged.emit($event)" />
  <app-widget-refresh-settings [widget]="widget()" (changed)="widgetChanged.emit($event)" />
</div>

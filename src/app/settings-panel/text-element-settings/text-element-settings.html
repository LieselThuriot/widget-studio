<label
  >Content<textarea [value]="element().text" (input)="changed.emit({ text: value($event) })">{{
    element().text
  }}</textarea>
</label>
<div class="formatting-tools" aria-label="Text formatting">
  <button
    type="button"
    [class.active]="(element().style.font.weight ?? 400) >= 600"
    aria-label="Toggle bold"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            weight: (element().style.font.weight ?? 400) >= 600 ? 400 : 700,
          },
        },
      })
    "
  >
    <strong>B</strong></button
  ><button
    type="button"
    [class.active]="element().style.font.style === 'italic'"
    aria-label="Toggle italic"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            style: element().style.font.style === 'italic' ? 'normal' : 'italic',
          },
        },
      })
    "
  >
    <em>I</em></button
  ><button
    type="button"
    [class.active]="element().style.font.decoration?.includes('underline')"
    aria-label="Toggle underline"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            decoration: toggleDecoration('underline'),
          },
        },
      })
    "
  >
    <u>U</u></button
  ><button
    type="button"
    [class.active]="element().style.font.decoration?.includes('line-through')"
    aria-label="Toggle strikethrough"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            decoration: toggleDecoration('line-through'),
          },
        },
      })
    "
  >
    <s>S</s>
  </button>
</div>
<label
  >Size<input
    type="number"
    [value]="element().style.font.size"
    (input)="
      changed.emit({
        style: { ...element().style, font: { ...element().style.font, size: number($event) } },
      })
    "
/></label>
<div class="text-layout-settings">
  <label
    >Horizontal alignment<select
      [value]="element().style.align"
      (change)="changed.emit({ style: { ...element().style, align: alignment($event) } })"
    >
      <option value="left">Left</option>
      <option value="center">Center</option>
      <option value="right">Right</option>
    </select></label
  ><label class="toggle-row"
    ><span>Wrap text</span
    ><input
      type="checkbox"
      [checked]="element().style.wrap"
      (change)="changed.emit({ style: { ...element().style, wrap: checked($event) } })" /><span
      class="toggle"
    ></span
  ></label>
</div>
<app-color-picker
  label="Color"
  [value]="element().style.color"
  (changed)="changed.emit({ style: { ...element().style, color: $event } })"
/>

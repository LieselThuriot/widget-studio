<label
  >Content<textarea [value]="element().text" (input)="changed.emit({ text: value($event) })">{{
    element().text
  }}</textarea>
</label>
<div class="formatting-tools" aria-label="Text formatting">
  <button
    type="button"
    [class.active]="element().style.font.bold === true"
    aria-label="Toggle bold"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            bold: !element().style.font.bold,
          },
        },
      })
    "
  >
    <strong>B</strong></button
  ><button
    type="button"
    [class.active]="element().style.font.italic === true"
    aria-label="Toggle italic"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            italic: !element().style.font.italic,
          },
        },
      })
    "
  >
    <em>I</em></button
  ><button
    type="button"
    [class.active]="element().style.font.underline === true"
    aria-label="Toggle underline"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            underline: !element().style.font.underline,
          },
        },
      })
    "
  >
    <u>U</u></button
  ><button
    type="button"
    [class.active]="element().style.font.strikethrough === true"
    aria-label="Toggle strikethrough"
    (click)="
      changed.emit({
        style: {
          ...element().style,
          font: {
            ...element().style.font,
            strikethrough: !element().style.font.strikethrough,
          },
        },
      })
    "
  >
    <s>S</s>
  </button>
</div>
<label
  >Size<input
    type="number"
    [value]="element().style.font.size"
    (input)="
      changed.emit({
        style: { ...element().style, font: { ...element().style.font, size: number($event) } },
      })
    "
/></label>
<div class="text-layout-settings">
  <label
    >Horizontal alignment<select
      [value]="element().style.align"
      (change)="changed.emit({ style: { ...element().style, align: alignment($event) } })"
    >
      <option value="left">Left</option>
      <option value="center">Center</option>
      <option value="right">Right</option>
    </select></label
  >
  <label class="toggle-row">
    <span>
      <strong>Wrap text</strong>
      <small>Keep text on multiple lines</small>
    </span>
    <input
      type="checkbox"
      [checked]="element().style.wrap"
      (change)="changed.emit({ style: { ...element().style, wrap: checked($event) } })"
    />
    <span class="toggle"></span>
  </label>
</div>
<app-color-picker
  label="Color"
  [value]="element().style.color"
  (changed)="changed.emit({ style: { ...element().style, color: $event } })"
/>
<app-color-picker
  label="Background"
  [value]="element().style.background"
  [clearable]="true"
  (changed)="changed.emit({ style: { ...element().style, background: $event } })"
  (cleared)="clearBackground()"
/>
<label
  >Corner radius (px)<input
    type="number"
    min="0"
    [value]="element().style.radius ?? 0"
    (input)="changed.emit({ style: { ...element().style, radius: number($event) } })"
/></label>
<label
  >Vertical padding (px)<input
    type="number"
    min="0"
    step="1"
    [value]="padding('vertical')"
    (input)="updatePadding('vertical', $event)"
/></label>
<label
  >Horizontal padding (px)<input
    type="number"
    min="0"
    step="1"
    [value]="padding('horizontal')"
    (input)="updatePadding('horizontal', $event)"
/></label>

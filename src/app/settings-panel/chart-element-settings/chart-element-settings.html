@if (element(); as current) {
  @if (current.type === 'progress') {
    <app-progress-element-settings [element]="current" (changed)="changed.emit($event)" />
  } @else if (current.type === 'gauge') {
    <app-gauge-element-settings [element]="current" (changed)="changed.emit($event)" />
  } @else {
    <app-series-chart-settings [element]="current" (changed)="changed.emit($event)" />
  }
}

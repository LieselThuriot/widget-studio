<label
  >Label<input [value]="element().label" (input)="changed.emit({ label: value($event) })"
/></label>
<div class="field-row">
  <label
    >Method<select [value]="element().method" (change)="changed.emit(methodChanged($event))">
      <option value="get">GET</option>
      <option value="post">POST</option>
    </select></label
  >
  <label
    >Style<select [value]="element().style" (change)="changed.emit({ style: style($event) })">
      <option value="solid">Solid</option>
      <option value="outline">Outline</option>
    </select></label
  >
</div>
<label
  >Request URL<input [value]="element().url" (input)="changed.emit({ url: value($event) })"
/></label>
@if (element().method === 'post') {
  <label
    >Request body<textarea
      [value]="element().body ?? ''"
      (input)="changed.emit({ body: value($event) })"
    ></textarea>
  </label>
}
<label class="toggle-row"
  ><span><strong>Refresh on click</strong><small>Emit a refresh request</small></span
  ><input
    type="checkbox"
    [checked]="element().requestRefresh"
    (change)="changed.emit({ requestRefresh: checked($event) })" /><span class="toggle"></span
></label>
<label class="toggle-row"
  ><span><strong>Show on hover</strong><small>Hide this button until hover</small></span
  ><input
    type="checkbox"
    [checked]="element().showOnlyOnHover"
    (change)="changed.emit({ showOnlyOnHover: checked($event) })" /><span class="toggle"></span
></label>

<section class="widget-setting-section">
  <div class="editor-section-heading widget-setting-section-heading">
    <span class="editor-eyebrow eyebrow">Grid</span
    ><span class="summary-value"
      >{{ widget().rows.length }} rows · {{ widget().columns.length }} columns</span
    >
  </div>
  <button type="button" class="editor-button edit-grid-button" (click)="isGridDialogOpen.set(true)">
    Edit grid
  </button>
  <label
    >Widget size<select
      [value]="widget().size"
      (change)="widgetChanged.emit({ size: size($event) })"
    >
      <option value="mini">Mini · 133 × 123</option>
      <option value="square">Square · 265 × 245</option>
      <option value="wide">Wide · 530 × 245</option>
      <option value="mega">Mega · 530 × 490</option>
      <option value="hero">Hero · 1060 × 490</option>
    </select></label
  >
  @if (isGridDialogOpen()) {
    <app-grid-editor-dialog
      [widget]="widget()"
      (saved)="saveGrid($event)"
      (closed)="isGridDialogOpen.set(false)"
    />
  }
</section>

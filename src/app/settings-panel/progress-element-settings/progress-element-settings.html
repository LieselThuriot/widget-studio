<label
  >Title<input [value]="element().title" (input)="changed.emit({ title: value($event) })"
/></label>
<app-color-picker
  label="Title color"
  [value]="element().style.color.title"
  (changed)="
    changed.emit({
      style: { ...element().style, color: { ...element().style.color, title: $event } },
    })
  "
/>
<div class="field-row">
  <label
    >Minimum<input
      type="number"
      [value]="element().data.min"
      (input)="changed.emit({ data: { ...element().data, min: number($event) } })"
  /></label>
  <label
    >Maximum<input
      type="number"
      [value]="element().data.max"
      (input)="changed.emit({ data: { ...element().data, max: number($event) } })"
  /></label>
</div>
<div class="field-row">
  <label
    >Segment radius<input
      type="number"
      min="0"
      [value]="element().style.radius?.segment ?? 0"
      (input)="
        changed.emit({
          style: {
            ...element().style,
            radius: {
              segment: number($event),
              track: element().style.radius?.track ?? 999,
            },
          },
        })
      "
  /></label>
  <label
    >Track radius<input
      type="number"
      min="0"
      [value]="element().style.radius?.track ?? 999"
      (input)="
        changed.emit({
          style: {
            ...element().style,
            radius: {
              segment: element().style.radius?.segment ?? 0,
              track: number($event),
            },
          },
        })
      "
  /></label>
</div>
<button type="button" class="editor-button data-points-button" (click)="isDataDialogOpen.set(true)">
  Edit progress items
</button>
@if (isDataDialogOpen()) {
  <app-data-points-dialog
    mode="progress"
    [points]="element().data.items"
    [maxTotal]="element().data.max - element().data.min"
    (saved)="saveData($event)"
    (closed)="isDataDialogOpen.set(false)"
  />
}
<div class="field-row color-fields stacked-fields">
  <app-color-picker
    label="Track"
    [value]="element().style.color.track"
    (changed)="
      changed.emit({
        style: { ...element().style, color: { ...element().style.color, track: $event } },
      })
    "
  />
</div>
<label class="toggle-row"
  ><span><strong>Show legend</strong><small>Display the label and value</small></span
  ><input
    type="checkbox"
    [checked]="element().showLegend"
    (change)="changed.emit({ showLegend: checked($event) })" /><span class="toggle"></span
></label>
<app-color-picker
  label="Legend color"
  [value]="element().style.color.legend"
  (changed)="
    changed.emit({
      style: { ...element().style, color: { ...element().style.color, legend: $event } },
    })
  "
/>
<label
  >Font size<input
    type="number"
    min="8"
    max="32"
    [value]="element().style.font.size"
    (input)="
      changed.emit({
        style: { ...element().style, font: { ...element().style.font, size: number($event) } },
      })
    "
/></label>

<div class="field-row">
  <label
    >Label<input
      [value]="element().data.label"
      (input)="changed.emit({ data: { ...element().data, label: value($event) } })"
  /></label>
  <label
    >Separator<input
      [value]="element().data.separator ?? ' of '"
      (input)="changed.emit({ data: { ...element().data, separator: value($event) } })"
  /></label>
</div>
<div class="field-row">
  <label
    >Minimum<input
      type="number"
      [value]="element().data.min"
      (input)="changed.emit({ data: { ...element().data, min: number($event) } })"
  /></label>
  <label
    >Value<input
      type="number"
      [value]="element().data.value"
      (input)="changed.emit({ data: { ...element().data, value: number($event) } })"
  /></label>
  <label
    >Maximum<input
      type="number"
      [value]="element().data.max"
      (input)="changed.emit({ data: { ...element().data, max: number($event) } })"
  /></label>
  <label
    >Suffix<input
      [value]="element().data.suffix ?? ''"
      (input)="changed.emit({ data: { ...element().data, suffix: value($event) } })"
  /></label>
</div>
<div class="field-row color-fields stacked-fields">
  <app-color-picker
    label="Fill"
    [value]="element().style.color.fill"
    (changed)="
      changed.emit({
        style: { ...element().style, color: { ...element().style.color, fill: $event } },
      })
    "
  />
  <app-color-picker
    label="Track"
    [value]="element().style.color.track"
    (changed)="
      changed.emit({
        style: { ...element().style, color: { ...element().style.color, track: $event } },
      })
    "
  />
</div>
<label class="toggle-row"
  ><span><strong>Show legend</strong><small>Display the label and value</small></span
  ><input
    type="checkbox"
    [checked]="element().showLegend"
    (change)="changed.emit({ showLegend: checked($event) })" /><span class="toggle"></span
></label>
<app-color-picker
  label="Legend color"
  [value]="element().style.color.legend"
  (changed)="
    changed.emit({
      style: { ...element().style, color: { ...element().style.color, legend: $event } },
    })
  "
/>
<label
  >Font size<input
    type="number"
    min="8"
    max="32"
    [value]="element().style.font.size"
    (input)="
      changed.emit({
        style: { ...element().style, font: { ...element().style.font, size: number($event) } },
      })
    "
/></label>
<label class="toggle-row"
  ><span><strong>Active</strong><small>Animate the progress fill</small></span
  ><input
    type="checkbox"
    [checked]="element().active"
    (change)="changed.emit({ active: checked($event) })" /><span class="toggle"></span
></label>

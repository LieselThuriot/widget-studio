<aside class="panel settings-panel" aria-label="Element settings">
  <div class="panel-heading">
    <div>
      <p class="eyebrow">Inspector</p>
      <h2>Settings</h2>
    </div>
  </div>
  @if (selectedElement(); as element) {
    <div class="selected-chip">
      <span class="chip-icon">{{ icon(element.type) }}</span
      ><span>{{ element.type | titlecase }}</span>
    </div>
    @if (element.type === 'text') {
      <app-text-element-settings [element]="element" (changed)="elementChanged.emit($event)" />
    } @else if (element.type === 'image') {
      <app-image-element-settings
        [element]="element"
        (changed)="elementChanged.emit($event)"
        (radiusChanged)="radiusChanged.emit($event)"
      />
    } @else {
      <app-button-element-settings [element]="element" (changed)="elementChanged.emit($event)" />
    }
    <app-anchor-control
      [value]="element.anchor"
      ariaLabel="Element anchor"
      (changed)="elementChanged.emit({ anchor: $event })"
    />
    <label class="toggle-row"
      ><span
        ><strong>Sensitive content</strong><small>Blur until the eye control is used</small></span
      ><input
        type="checkbox"
        [checked]="element.sensitive"
        (change)="elementChanged.emit({ sensitive: $any($event.target).checked })" /><span
        class="toggle"
      ></span
    ></label>
    <div class="placement">
      <p class="eyebrow">Grid placement</p>
      <div class="field-row">
        <label
          >Row<input
            type="number"
            min="1"
            [max]="widget().rows.length"
            [value]="element.row + 1"
            (input)="
              placementChanged.emit({ kind: 'row', value: +$any($event.target).value })
            " /></label
        ><label
          >Column<input
            type="number"
            min="1"
            [max]="widget().columns.length"
            [value]="element.column + 1"
            (input)="placementChanged.emit({ kind: 'column', value: +$any($event.target).value })"
        /></label>
      </div>
      <div class="field-row">
        <label
          >Row span<input
            type="number"
            min="1"
            [max]="widget().rows.length - element.row"
            [value]="element.rowSpan"
            (input)="
              spanChanged.emit({ kind: 'rowSpan', value: +$any($event.target).value })
            " /></label
        ><label
          >Column span<input
            type="number"
            min="1"
            [max]="widget().columns.length - element.column"
            [value]="element.columnSpan"
            (input)="spanChanged.emit({ kind: 'columnSpan', value: +$any($event.target).value })"
        /></label>
      </div>
    </div>
  } @else {
    <app-widget-settings
      [widget]="widget()"
      (widgetChanged)="widgetChanged.emit($event)"
      (trackChanged)="trackChanged.emit($event)"
      (trackAdded)="trackAdded.emit($event)"
      (trackRemoved)="trackRemoved.emit($event)"
    />
  }
</aside>

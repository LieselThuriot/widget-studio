<label
  >Title<input [value]="element().title" (input)="changed.emit({ title: value($event) })"
/></label>
<app-color-picker
  label="Title color"
  [value]="style().color.title"
  (changed)="changed.emit({ style: { ...style(), color: { ...style().color, title: $event } } })"
/>
<label
  >Font size<input
    type="number"
    min="8"
    max="32"
    [value]="style().font.size"
    (input)="
      changed.emit({ style: { ...style(), font: { ...style().font, size: number($event) } } })
    "
/></label>
<button type="button" class="editor-button data-points-button" (click)="isDataDialogOpen.set(true)">
  Edit data points
</button>
@if (element().type === 'pie' || element().type === 'donut') {
  <label class="toggle-row"
    ><span><strong>Show legend</strong><small>Display labels for chart data</small></span
    ><input
      type="checkbox"
      [checked]="element().showLegend"
      (change)="changed.emit({ showLegend: checked($event) })" /><span class="toggle"></span
  ></label>
  <app-color-picker
    label="Legend color"
    [value]="style().color.legend"
    (changed)="changed.emit({ style: { ...style(), color: { ...style().color, legend: $event } } })"
  />
}
@if (isDataDialogOpen()) {
  <app-data-points-dialog
    [points]="element().data"
    (saved)="saveData($event)"
    (closed)="isDataDialogOpen.set(false)"
  />
}
@if (element().type === 'bar' || element().type === 'line') {
  @if (element().type === 'line') {
    <app-color-picker
      label="Line color"
      [value]="style().color.line"
      (changed)="changed.emit({ style: { ...style(), color: { ...style().color, line: $event } } })"
    />
  }
  <app-color-picker
    label="Axis labels"
    [value]="style().axis.label"
    (changed)="changed.emit({ style: { ...style(), axis: { ...style().axis, label: $event } } })"
  />
  <app-color-picker
    label="Axis line"
    [value]="style().axis.line"
    (changed)="changed.emit({ style: { ...style(), axis: { ...style().axis, line: $event } } })"
  />
  <app-color-picker
    label="Grid"
    [value]="style().axis.grid"
    (changed)="changed.emit({ style: { ...style(), axis: { ...style().axis, grid: $event } } })"
  />
}

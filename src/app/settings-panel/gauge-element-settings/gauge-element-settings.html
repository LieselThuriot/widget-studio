<label
  >Title<input [value]="element().title" (input)="changed.emit({ title: value($event) })"
/></label>
<label
  >Title color<input
    type="color"
    [value]="element().style.color.title"
    (input)="
      changed.emit({
        style: { ...element().style, color: { ...element().style.color, title: value($event) } },
      })
    "
/></label>
<div class="field-row">
  <label
    >Value<input
      type="number"
      [value]="element().data.value"
      (input)="changed.emit({ data: { ...element().data, value: number($event) } })"
  /></label>
  <label
    >Minimum<input
      type="number"
      [value]="element().data.min"
      (input)="changed.emit({ data: { ...element().data, min: number($event) } })"
  /></label>
  <label
    >Maximum<input
      type="number"
      [value]="element().data.max"
      (input)="changed.emit({ data: { ...element().data, max: number($event) } })"
  /></label>
</div>
<div class="field-row color-fields stacked-fields">
  <label
    >Fill color<input
      type="color"
      [value]="element().style.color.fill"
      (input)="
        changed.emit({
          style: { ...element().style, color: { ...element().style.color, fill: value($event) } },
        })
      "
  /></label>
  <label
    >Track color<input
      type="color"
      [value]="element().style.color.track"
      (input)="
        changed.emit({
          style: { ...element().style, color: { ...element().style.color, track: value($event) } },
        })
      "
  /></label>
</div>
<label class="toggle-row"
  ><span><strong>Show legend</strong><small>Display gauge labels and value</small></span
  ><input
    type="checkbox"
    [checked]="element().showLegend"
    (change)="changed.emit({ showLegend: checked($event) })" /><span class="toggle"></span
></label>
<label
  >Legend color<input
    type="color"
    [value]="element().style.color.legend"
    (input)="
      changed.emit({
        style: { ...element().style, color: { ...element().style.color, legend: value($event) } },
      })
    "
/></label>
<label
  >Font size<input
    type="number"
    min="8"
    max="32"
    [value]="element().style.font.size"
    (input)="
      changed.emit({
        style: { ...element().style, font: { ...element().style.font, size: number($event) } },
      })
    "
/></label>

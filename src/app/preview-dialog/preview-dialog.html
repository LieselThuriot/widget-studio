<div
  class="editor-overlay preview-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="preview-title"
  tabindex="-1"
  (click)="close()"
  (keydown)="onKeyDown($event)"
>
  <div
    class="editor-overlay__panel preview-window"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="onKeyDown($event)"
  >
    <header class="preview-header">
      <div>
        <p class="editor-eyebrow eyebrow">Preview</p>
        <h2 id="preview-title">This is how your widget will look</h2>
      </div>
      <div class="preview-header-actions">
        <button
          type="button"
          class="editor-button editor-button--icon preview-close"
          aria-label="Close live preview"
          (click)="close()"
        >
          ×
        </button>
        <button
          type="button"
          class="editor-button loading-toggle"
          [attr.aria-pressed]="previewLoading() !== false"
          (click)="toggleLoading()"
        >
          {{ previewLoading() !== false ? 'Show widget' : 'Show loading' }}
        </button>
      </div>
    </header>
    <div
      class="preview-stage"
      [attr.aria-busy]="previewLoading() !== false"
      [attr.aria-label]="previewLoading() !== false ? 'Widget loading' : null"
    >
      <widget-renderer
        [widget]="widget()"
        [darkMode]="darkMode()"
        [loading]="previewLoading()"
        (refreshRequested)="refreshRequested.emit()"
        (actionRequested)="actionRequested.emit($event)"
      />
    </div>
    <p class="preview-hint">
      {{
        previewLoading() !== false
          ? 'Loading state enabled for this preview.'
          : 'Click an action or refresh control to inspect its event data.'
      }}
    </p>
  </div>
</div>

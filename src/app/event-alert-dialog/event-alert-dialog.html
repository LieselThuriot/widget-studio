@if (alert(); as alert) {
  <div
    class="editor-overlay alert-overlay"
    role="presentation"
    tabindex="-1"
    (click)="close()"
    (keydown)="$event.stopPropagation()"
  >
    <section
      class="editor-overlay__panel event-alert"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="event-alert-title"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onKeyDown($event)"
    >
      <div class="alert-icon" aria-hidden="true">
        @switch (alert.kind) {
          @case ('refresh') {
            ↻
          }
          @case ('landscape-confirm') {
            ✓
          }
          @default {
            ↗
          }
        }
      </div>
      @switch (alert.kind) {
        @case ('action') {
          <app-action-alert [alert]="alert" />
        }
        @case ('refresh') {
          <app-refresh-alert [alert]="alert" />
        }
        @case ('landscape-confirm') {
          <app-landscape-confirm-alert [alert]="alert" />
        }
      }
      <button
        type="button"
        class="editor-button editor-button--primary alert-close"
        (click)="close()"
      >
        Close
      </button>
    </section>
  </div>
}

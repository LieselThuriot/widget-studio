<div class="alert-content">
  <p class="editor-eyebrow eyebrow">Refresh event</p>
  <h2 id="event-alert-title">Refresh requested</h2>
  <p class="alert-description">The renderer emitted the configured refresh event.</p>
  <dl class="event-data">
    <div>
      <dt>Event</dt>
      <dd>refreshRequested</dd>
    </div>
    <div>
      <dt>Widget ID</dt>
      <dd>{{ alert().widgetId }}</dd>
    </div>
    <div>
      <dt>Label</dt>
      <dd>{{ alert().label }}</dd>
    </div>
  </dl>
</div>

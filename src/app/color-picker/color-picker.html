<div class="color-picker" [class.is-inline]="inline()">
  <div class="color-picker-label">
    <span>{{ label() }}</span>
    @if (clearable()) {
      <button
        type="button"
        class="clear-button"
        [class.has-color]="value()"
        [disabled]="!value()"
        [attr.aria-label]="'Clear ' + label().toLowerCase()"
        (click)="cleared.emit()"
      >
        ×
      </button>
    }
  </div>
  <div
    class="color-input"
    [class.is-transparent]="isTransparent()"
    [style.background-color]="inputValue()"
  >
    <input
      type="color"
      [value]="inputValue()"
      [attr.aria-label]="label()"
      (input)="onInput($event)"
    />
  </div>
  <div class="alpha-control">
    <label [for]="alphaId"
      >Opacity <output>{{ alphaValue() }}%</output></label
    >
    <div class="alpha-track" [style.--opacity-color]="inputValue()">
      <input
        [id]="alphaId"
        type="range"
        min="0"
        max="100"
        [value]="alphaValue()"
        [attr.aria-label]="label() + ' opacity'"
        (input)="onAlphaInput($event)"
      />
    </div>
  </div>
</div>

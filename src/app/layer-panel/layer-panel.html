<div class="panel-heading compact">
  <div>
    <p class="eyebrow">On canvas</p>
    <h2>Layers</h2>
  </div>
  <button
    type="button"
    class="clear-layers"
    [disabled]="!elements().length"
    (click)="layersCleared.emit()"
  >
    Clear all
  </button>
</div>
<div class="layer-list" role="list" aria-label="Widget layers">
  @for (element of elements(); track element.id; let index = $index) {
    <div
      class="layer"
      role="listitem"
      [attr.aria-posinset]="index + 1"
      [attr.aria-setsize]="elements().length"
      draggable="true"
      [class.selected]="element.id === selectedId()"
      (dragstart)="dragStarted.emit({ event: $event, id: element.id })"
      (dragover)="$event.preventDefault()"
      (drop)="layerDropped.emit({ event: $event, id: element.id })"
    >
      <button type="button" class="layer-select" (click)="elementSelected.emit(element.id)">
        <span class="layer-grip" aria-hidden="true">⋮⋮</span><span>{{ icon(element) }}</span
        >{{ label(element) }}</button
      ><button
        type="button"
        class="layer-actions-trigger"
        [attr.aria-label]="'Actions for ' + label(element)"
        [attr.aria-expanded]="openActionsId() === element.id"
        (click)="toggleActions(element.id, $event)"
      >
        <span aria-hidden="true">•••</span>
      </button>
      @if (openActionsId() === element.id) {
        <div class="layer-actions" aria-label="Layer actions" role="menu">
          <button
            type="button"
            role="menuitem"
            [disabled]="!canMove(index, 'up')"
            (click)="changeStack(element.id, 'up')"
          >
            Move up
          </button>
          <button
            type="button"
            role="menuitem"
            [disabled]="!canMove(index, 'down')"
            (click)="changeStack(element.id, 'down')"
          >
            Move down
          </button>
          <div class="layer-menu-divider" role="separator"></div>
          <button
            type="button"
            role="menuitem"
            [disabled]="!canMove(index, 'front')"
            (click)="changeStack(element.id, 'front')"
          >
            Bring to front
          </button>
          <button
            type="button"
            role="menuitem"
            [disabled]="!canMove(index, 'back')"
            (click)="changeStack(element.id, 'back')"
          >
            Send to back
          </button>
          <div class="layer-menu-divider" role="separator"></div>
          <button
            type="button"
            class="layer-menu-delete"
            role="menuitem"
            (click)="elementDeleted.emit(element.id); closeActions()"
          >
            Delete
          </button>
        </div>
      }
    </div>
  }
</div>

<header class="topbar">
  <div class="brand-mark">
    <img ngSrc="android-chrome-192x192.png" width="30" height="30" alt="Widget Studio logo" />
  </div>
  <div>
    <p class="editor-eyebrow eyebrow studio-name">Widget studio</p>
    <h1 class="studio-tagline">Build widgets that fit your workflow</h1>
  </div>
  <div class="header-actions">
    <button
      type="button"
      class="editor-button editor-button--subtle preview-button"
      (click)="previewRequested.emit()"
    >
      <span class="live-dot" aria-hidden="true"></span> Preview
    </button>
    <button
      type="button"
      class="editor-button editor-button--subtle share-button"
      (click)="shareRequested.emit()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <circle cx="18" cy="5" r="2.5"></circle>
        <circle cx="6" cy="12" r="2.5"></circle>
        <circle cx="18" cy="19" r="2.5"></circle>
        <path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"></path>
      </svg>
      Share
    </button>
    <button
      type="button"
      class="editor-segmented theme-button"
      [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="darkMode()"
      [class.is-dark]="darkMode()"
      (click)="darkModeToggled.emit()"
    >
      <span class="editor-segmented__item" aria-hidden="true">☀ Light</span>
      <span class="editor-segmented__item" aria-hidden="true">☾ Dark</span>
    </button>
  </div>
</header>

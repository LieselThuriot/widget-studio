<div
  class="editor-canvas"
  [class.show-guides]="ctrlPressed()"
  [class.is-dragging]="draggingId()"
  [style.width.px]="widgetWidth()"
  [style.height.px]="widgetHeight()"
  role="region"
  aria-label="Widget editor canvas"
  tabindex="0"
  (click)="pointerClick($event)"
  (keydown)="onCanvasKeyDown($event)"
  (pointerdown)="pointerDown($event)"
  (contextmenu)="pointerContextMenu($event)"
  (pointermove)="moveDrag($event)"
  (pointerup)="endDrag($event)"
  (pointercancel)="endDrag($event)"
>
  <widget-renderer
    [widget]="widget()"
    [darkMode]="darkMode()"
    (refreshRequested)="refreshRequested.emit()"
    (actionRequested)="actionRequested.emit($event)"
  />
  <div
    class="editor-grid"
    [style.grid-template-rows]="overlayRows()"
    [style.grid-template-columns]="overlayColumns()"
  >
    @for (element of widget().elements; track element.id) {
      <app-canvas-element-overlay
        [element]="element"
        [selected]="element.id === selectedId()"
        [dragging]="element.id === draggingId()"
        [showGuides]="ctrlPressed()"
        (focused)="elementSelected.emit($event)"
        (deleteRequested)="deleteElement(element.id, $event)"
        (resizeStarted)="startResize(element, $event.axis, $event.event)"
      />
    }
  </div>
  @if (contextMenu(); as menu) {
    <app-element-actions-menu
      placement="canvas"
      [x]="menu.x"
      [y]="menu.y"
      [index]="contextMenuIndex()"
      [count]="widget().elements.length"
      (stackChanged)="changeStack($event)"
      (deleteRequested)="deleteElement(menu.id)"
      (closed)="closeContextMenu()"
    />
  }
</div>

<div
  class="editor-canvas"
  [class.show-guides]="ctrlPressed()"
  [class.is-dragging]="draggingId()"
  [style.width.px]="widgetWidth()"
  [style.height.px]="245"
  role="region"
  aria-label="Widget editor canvas"
  tabindex="0"
  (click)="pointerClick($event)"
  (keydown.enter)="selectWidget()"
  (keydown.space)="selectWidget()"
  (keydown)="onCanvasKeyDown($event)"
  (pointerdown)="pointerDown($event)"
  (contextmenu)="pointerContextMenu($event)"
  (pointermove)="moveDrag($event)"
  (pointerup)="endDrag($event)"
  (pointercancel)="endDrag($event)"
>
  <widget-renderer
    [widget]="widget()"
    (refreshRequested)="refreshRequested.emit()"
    (actionRequested)="actionRequested.emit($event)"
  />
  <div
    class="editor-grid"
    [style.grid-template-rows]="gridRows()"
    [style.grid-template-columns]="gridColumns()"
  >
    @for (element of widget().elements; track element.id) {
      <div
        class="editor-element"
        tabindex="0"
        [attr.aria-label]="elementLabel(element)"
        [attr.aria-selected]="element.id === selectedId()"
        [attr.data-widget-element-id]="element.id"
        [class.selected]="element.id === selectedId()"
        [class.is-dragging]="element.id === draggingId()"
        [style]="elementStyle(element)"
      >
        @if (ctrlPressed()) {
          <button
            type="button"
            class="element-delete"
            aria-label="Delete element"
            (click)="deleteElement(element.id, $event)"
          >
            ×
          </button>
        }
        @if (element.id === selectedId()) {
          <span
            class="resize-handle resize-right"
            role="presentation"
            (pointerdown)="startResize(element, 'column', $event)"
          ></span>
          <span
            class="resize-handle resize-bottom"
            role="presentation"
            (pointerdown)="startResize(element, 'row', $event)"
          ></span>
        }
      </div>
    }
  </div>
  @if (contextMenu(); as menu) {
    <div
      class="element-context-menu"
      [style.left.px]="menu.x"
      [style.top.px]="menu.y"
      role="menu"
      aria-label="Element layer order"
      (pointerdown)="$event.stopPropagation()"
    >
      <button type="button" role="menuitem" (click)="changeStack('up', $event)">Move up</button
      ><button type="button" role="menuitem" (click)="changeStack('down', $event)">
        Move down
      </button>
      <div class="menu-divider"></div>
      <button type="button" role="menuitem" (click)="changeStack('front', $event)">
        Bring to front</button
      ><button type="button" role="menuitem" (click)="changeStack('back', $event)">
        Send to back
      </button>
      <div class="menu-divider"></div>
      <button
        type="button"
        class="menu-delete"
        role="menuitem"
        (click)="deleteElement(menu.id, $event)"
      >
        Delete
      </button>
    </div>
  }
</div>

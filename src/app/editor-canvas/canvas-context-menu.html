<div
  class="element-context-menu"
  [style.left.px]="menu().x"
  [style.top.px]="menu().y"
  role="menu"
  aria-label="Element layer order"
  (pointerdown)="$event.stopPropagation()"
>
  <button type="button" role="menuitem" (click)="stackChanged.emit('up'); closed.emit()">
    Move up</button
  ><button type="button" role="menuitem" (click)="stackChanged.emit('down'); closed.emit()">
    Move down
  </button>
  <div class="menu-divider"></div>
  <button type="button" role="menuitem" (click)="stackChanged.emit('front'); closed.emit()">
    Bring to front</button
  ><button type="button" role="menuitem" (click)="stackChanged.emit('back'); closed.emit()">
    Send to back
  </button>
  <div class="menu-divider"></div>
  <button
    type="button"
    class="menu-delete"
    role="menuitem"
    (click)="deleteRequested.emit(); closed.emit()"
  >
    Delete
  </button>
</div>

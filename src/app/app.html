<main class="workspace">
  <app-studio-header
    [darkMode]="darkMode()"
    (darkModeToggled)="toggleDarkMode()"
    (previewRequested)="openPreview()"
    (shareRequested)="openShare()"
  />
  <div class="studio-grid">
    <aside class="editor-panel panel palette-panel" aria-label="Widget elements">
      <div class="editor-section-heading panel-heading">
        <div>
          <p class="editor-eyebrow eyebrow">Building blocks</p>
          <h2>Elements</h2>
        </div>
        <span class="count">{{ widget().elements.length }}</span>
      </div>
      <app-element-palette
        [items]="palette"
        (elementAdded)="addElement($event)"
        (dragStarted)="dragStart($event.event, $event.type)"
      />
      <div class="panel-divider"></div>
      <app-layer-panel
        [elements]="widget().elements"
        [selectedId]="selectedId()"
        (elementSelected)="selectElement($event)"
        (elementDeleted)="deleteElement($event)"
        (layersCleared)="clearLayers()"
        (dragStarted)="layerDragStart($event.event, $event.id)"
        (layerDropped)="reorderLayer($event.event, $event.id)"
        (stackChanged)="changeStack($event)"
      />
    </aside>
    <div class="canvas-column">
      <app-canvas-workspace
        [widget]="widget()"
        [darkMode]="darkMode()"
        [selectedId]="selectedId()"
        [samples]="samples"
        [selectedSampleId]="widgetSampleId()"
        (sampleSelected)="loadSample($event)"
        (elementDropped)="dropElement($event)"
        (widgetSelected)="selectWidget()"
        (elementSelected)="selectElement($event)"
        (elementDeleted)="deleteElement($event)"
        (elementMoved)="moveElement($event)"
        (elementResized)="resizeElement($event)"
        (elementStackChanged)="changeStack($event)"
        (refreshRequested)="onRefresh()"
        (actionRequested)="onAction($event)"
      />
      <app-output-contract [modelJson]="modelJson()" />
    </div>
    <app-settings-panel
      [widget]="widget()"
      [selectedElement]="selectedElement()"
      (elementChanged)="updateSelected($event)"
      (widgetChanged)="updateWidget($event)"
      (placementChanged)="updatePosition($event.kind, $event.value)"
      (spanChanged)="updateSpan($event.kind, $event.value)"
      (radiusChanged)="updateRadius($event)"
      (trackChanged)="updateTrack($event.kind, $event.index, $event.patch)"
      (trackAdded)="addTrack($event)"
      (trackRemoved)="removeTrack($event.kind, $event.index)"
    />
  </div>
</main>
@if (shareLoadMessage(); as message) {
  <div class="share-load-message" role="alert">
    <span>{{ message }}</span>
    <button
      type="button"
      class="editor-button editor-button--icon editor-button--subtle"
      aria-label="Dismiss message"
      (click)="dismissShareLoadMessage()"
    >
      ×
    </button>
  </div>
}
@if (isPreviewOpen()) {
  <app-preview-dialog
    [widget]="widget()"
    [darkMode]="darkMode()"
    (closed)="closePreview()"
    (refreshRequested)="onRefresh()"
    (actionRequested)="onAction($event)"
  />
}
@if (isShareOpen()) {
  <app-share-dialog [modelJson]="modelJson()" (closed)="closeShare()" />
}
<app-event-alert-dialog [alert]="actionAlert()" (closed)="closeActionAlert()" />
